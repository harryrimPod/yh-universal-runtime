<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a12"><title>YH · Three.js Example</title></head>
<body>
  <main class="demo-shell">
    <header><a href="/">YH / UNIVERSAL RUNTIME</a><span class="engine-tag">THREE.JS</span></header>
    <section class="demo-copy"><p class="kicker">ENGINE SAMPLE 01 / THREE.JS</p><h1>Local event → <em>Three.js</em></h1><p>通过同一个 YHEventClient 订阅 <code>/yh/level</code> 与 <code>/yh/onset</code>。</p></section>
    <section class="scene-card"><div id="scene" class="scene"><canvas id="canvas"></canvas><div class="scene-state"><i id="dot"></i><span id="status">连接中…</span></div><div class="scene-level">LEVEL <b id="level">0.42</b></div></div></section>
    <section class="controls"><div><label for="levelInput">合成 level</label><input id="levelInput" type="range" min="0" max="1" step="0.01" value="0.42"><button id="sendLevel">发送 /yh/level</button></div><button id="sendOnset" class="accent">触发合成 /yh/onset</button></section>
    <p class="note">麦克风由主 YH 页面统一处理；本示例不录音。仅 localhost WebSocket + OSC/UDP 回环。</p>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
